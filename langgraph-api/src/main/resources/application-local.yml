spring:
  #mysql相关配置
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.xx.67.xx:4000/xxx?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&useCursorFetch=true&rewriteBatchedStatements=true
    username: xxx
    password: xxx
    hikari:
      minimum-idle: 10
      # 空闲连接存活最大时间，默认600000（10分钟）
      idle-timeout: 180000
      # 连接池最大连接数，默认是10
      maximum-pool-size: 40
      # 连接池名称
      pool-name: MyHikariCP
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      max-lifetime: 1800000
      # 数据库连接超时时间,默认30秒，即30000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      FAIL_ON_EMPTY_BEANS: false #解决mybatis 级联查询懒加载对象无法序列化问题
    generator:
      WRITE_BIGDECIMAL_AS_PLAIN: true #不使用科学计数法
#  redis:
#    enabled: true # 自定义属性
#    password: xxx
#    timeout: 200
#    connect-timeout: 5000
#    cluster:
#      nodes: ip1:port1,...

#mybatis plus
mybatis-plus:
  type-aliases-package: com.moli.common.dao.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 配置的缓存的全局开关
    cache-enabled: true
    # 延时加载的开关
    lazy-loading-enabled: true
    # 开启的话，延时加载一个属性时会加载该对象全部属性，否则按需加载属性
    multiple-result-sets-enabled: true
    use-generated-keys: false
    default-statement-timeout: 120
    default-fetch-size: 100

logging:
  config: classpath:spring-logback.xml
  level:
    root: info
    com:
      moli: debug


